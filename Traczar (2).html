 if(cat==='math'){tag='MATH';const k=rnd(0,2);if(k===0){const n=rnd(5,30);t=`Σ(1..${n}) = n(n+1)/2 = ${n*(n+1)/2}`}else if(k===1){const a=rnd(1,9),b=rnd(1,9);t=`x² − ${a+b}x + ${a*b} = 0\n(x−${a})(x−${b}) ⇒ x = ${a}, ${b}`}else t=`φ = (1+√5)/2 ≈ 1.618\nF(${rnd(8,14)}) / F(${rnd(7,13)}) hugs it from both sides.`}
 else if(cat==='geometry'){tag='GEOMETRY';const k=rnd(0,2);if(k===0){const [a,b,c]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),m=rnd(1,3);t=`a=${a*m}, b=${b*m} → c=√(a²+b²)=${c*m}`}else if(k===1){const r=rnd(2,9);t=`r=${r}: A=πr²=${(Math.PI*r*r).toFixed(2)}, C=2πr=${(2*Math.PI*r).toFixed(2)}`}else{const n=rnd(5,10);t=`${n}-gon: interior angles sum (n−2)·180° = ${(n-2)*180}°`}}
 else if(cat==='algebra'){tag='ALGEBRA';const x=rnd(1,12),a=rnd(2,9),b=rnd(1,15);t=`${a}x + ${b} = ${a*x+b}\nx = (${a*x+b}−${b})/${a} = ${x}`}
 else if(cat==='code'){tag='PROGRAMMING';t=pick(CODE)}else if(cat==='weather'){tag='WEATHER FORECAST';t=forecast()}else{tag='LITERATURE';t=pick(LIT)}
 return addNote(tag,t)}
const OPEN=[329.63,246.94,196,146.83,110,82.41];
function makeTab(){const slots=Array.from({length:8},(_,i)=>i%2===0&&Math.random()<.2?null:{s:rnd(0,5),f:rnd(0,7)});man.riff=slots;
 return addNote('TABLATURE',`riff · 4/4 · ♩=${Math.round(bpm)}\n`+['e','B','G','D','A','E'].map((n,i)=>n+'|'+slots.map(s=>s&&s.s===i?s.f+'-':'--').join('')+'|').join('\n'),'tab')}

/* ---- audio ---- */
let ac=null,snd=false;
function tone(f,type,len,vol){if(!ac||!snd)return;const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(vol,ac.currentTime);n.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+len);o.connect(n).connect(ac.destination);o.start();o.stop(ac.currentTime+len)}
$('snd').onclick=e=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();snd=!snd;if(snd)ac.resume();e.target.textContent=snd?'♪ sound on':'♪ sound off'};
const pluck=s=>{if(s)tone(OPEN[s.s]*Math.pow(2,s.f/12),'triangle',.6,.07)};

/* ---- behaviour ---- */
const man={x:0,z:-2,act:'look',tx:0,tz:-2,next:'look',path:[],startBeat:0,endBeat:3,note:null,ex:'',lastPick:'',tree:null,inside:false,tIn:false};
const isIn=(x,z)=>Math.abs(x)<5.8&&z<-4.6&&z>-13.4;
const DUR={write:12,tab:16,chop:16,fire:8,gym:16,talk:8,look:3,sleep:28};
const NAMES={walk:'on the move',look:'looking at the sky',write:'taking notes',tab:'writing tablature',chop:'cutting wood',fire:'tending the fireplace',gym:'exercise',talk:'muttering',sleep:'sleeping'};
const SAY=['Hm. Three, four, five again.','Wind’s from the north. Of course it is.','Left foot, right foot, ledger of the day.','Square root of two… still unreasonable.','Wood. Fire. Sums. Good.','Who needs a piano?','Traczar, you old rascal.','Cold hands, warm logic.','2400 metres. Summer is a rumour.'];
function go(tx,tz,next){man.path=[];const ti=isIn(tx,tz);if(ti!==man.inside)man.path.push(...(man.inside?[[0,-5.6],[0,-3.4]]:[[0,-3.4],[0,-5.6]]));man.path.push([tx,tz]);man.next=next;man.tIn=ti;man.act='walk';const p=man.path.shift();man.tx=p[0];man.tz=p[1]}
function choose(){const hr=dayT()*24,t=temp(),sleepy=hr>=22||hr<5.5,hh=harsh(),wet=L.rain>.3||L.snow>.3||t<0,home=hh||sleepy||wet||t<4;
 const wt={write:3,tab:1.6,chop:2.5,fire:2,gym:2.2,talk:1,wander:3,sleep:0};
 if(hh){wt.chop=0;wt.wander=0;wt.write*=2;wt.tab*=2;wt.fire*=2}else if(wet){wt.wander*=.4;wt.chop*=.6}
 if(sleepy){wt.sleep=40;wt.wander=wt.chop=0;wt.gym=0;wt.write*=.3}
 if(logs<1){wt.fire=0;wt.chop=hh||sleepy?0:wt.chop*6}else if(fireOn)wt.fire*=.1;else if(t<8||hh)wt.fire*=4;
 if(!trees.some(t=>t.blocks>0))wt.chop=0;if(wt[man.lastPick]>0)wt[man.lastPick]*=.2;
 let tot=0;for(const k in wt)tot+=wt[k];let r=Math.random()*tot,a='wander';for(const k in wt){r-=wt[k];if(r<=0){a=k;break}}
 man.lastPick=a;let next=a,p;
 if(a==='write')p=home?[-3.5,-10.6]:pick([[-14,1],[-9.5,-1.8],[15,2],[44,2.5]]);
 else if(a==='tab')p=home?[-3.5,-10.6]:[-9.5,-1.8];
 else if(a==='gym')p=home?[.4,-8.2]:[46,1.2];
 else if(a==='fire')p=[1.3,-11.2];else if(a==='sleep')p=[4.6,-9];
 else if(a==='chop'){const tr=pick(trees.filter(t=>t.blocks>0));p=[tr.x-1.5,tr.z];man.tree=tr}
 else if(a==='talk')p=[man.x,man.z];
 else{p=[clamp(man.x+rnd(-22,22),-22,60),Math.random()*5-1];next='look'}
 go(p[0],p[1],next)}
function startAct(a){man.act=a;man.startBeat=beat;man.endBeat=beat+DUR[a];man.note=null;
 if(a==='write')man.note=makeNote();if(a==='tab')man.note=makeTab();
 if(a==='gym')man.ex=pick(['squats','jumping jacks','push-ups']);if(a==='talk')bub.textContent=pick(SAY)}
const dots=[...document.querySelectorAll('#dots i')];
function onBeat(){const b=beat%4;dots.forEach((d,i)=>d.className=i===b?'on'+(b===0?' b1':''):'');
 if(b===0)tone(55,'sine',.45,.14);else tone(220,'sine',.05,.03);
 if(man.act==='chop'){const t=man.tree;if(t&&t.blocks>0){t.hits++;for(let i=0;i<5;i++)spawn(false,t.x-.5,1.2,t.z,-1-Math.random()*2,2+Math.random()*3,Math.random()*2-1,.8,.12,-12);
  if(t.hits>=4){t.hits=0;t.blocks--;logs++;if(t.blocks<=0)t.regrow=45;setTree(t)}}}
 if(man.act==='tab'&&man.riff){const i=((beat-man.startBeat)%4)*2;pluck(man.riff[i]);setTimeout(()=>pluck(man.riff[i+1]),30000/bpm)}
 if(man.act==='fire'&&beat===man.startBeat+4&&logs>0&&!fireOn){logs--;fireOn=true;fireT=110}
 if(!man.inside&&temp()<5&&beat%2===0)spawn(true,man.x+Math.sin(man3.rotation.y)*.6,2.4,man.z+Math.cos(man3.rotation.y)*.6,0,.5,0,1.2,.15,0);
 if(harsh()&&!man.inside&&!man.tIn&&man.act!=='walk'||harsh()&&man.act==='walk'&&!man.tIn&&!man.inside){bub.style.display='none';choose();return}
 if(man.act!=='walk'&&beat>=man.endBeat){bub.style.display='none';choose()}}

/* ---- pose ---- */
let cur={aR:0,aL:0,lR:0,lL:0},ang=0;
function pose(dt){const a=man.act,s=Math.sin(beatF*Math.PI),f=beatF%1,odd=beat%2,o=(1-Math.cos(beatF*Math.PI*2))/2,q=(1-Math.cos(beatF*Math.PI))/2;
 let aR=.05,aL=-.05,lR=0,lL=0,az=0,lz=0,legS=1,lean=0,by=0,face=0;nb.visible=a==='write'||a==='tab';axe.visible=a==='chop';beanie.visible=temp()<3&&!man.inside;
 if(a==='walk'){aR=s*.8;aL=-s*.8;lR=-s*.8;lL=s*.8;by=Math.abs(s)*.07;face=Math.atan2(man.tx-man.x,man.tz-man.z)}
 else if(a==='write'||a==='tab'){aR=-1.3;aL=.1;head.rotation.x=.25}
 else if(a==='chop'){aR=f<.75?lerp(-.75,-2.7,f/.75):lerp(-2.7,-.75,(f-.75)/.25);aL=aR*.85;face=Math.PI/2}
 else if(a==='fire'){legS=.45;aR=-1.2;aL=-.3;face=Math.PI/2}
 else if(a==='sleep'){aR=aL=0;lean=-1.52;by=.95}
 else if(a==='gym'){if(man.ex==='squats'){legS=1-.5*q;aR=aL=-1.5*q}else if(man.ex==='jumping jacks'){az=o*2.8;lz=o*.3;by=o*.3}else{lean=1.25;by=.28+.1*(1-q);aR=aL=-lean;face=Math.PI/2}}
 else if(a==='talk'){aR=odd?-2.2:.05}
 if(a!=='write'&&a!=='tab')head.rotation.x=a==='look'?-.35:0;
 const k=Math.min(1,dt*30);cur.aR+=(aR-cur.aR)*k;cur.aL+=(aL-cur.aL)*k;cur.lR+=(lR-cur.lR)*k;cur.lL+=(lL-cur.lL)*k;
 armR.rotation.set(cur.aR,0,-az);armL.rotation.set(cur.aL,0,az);legR.rotation.set(cur.lR,0,-lz);legL.rotation.set(cur.lL,0,lz);
 legR.scale.y=legL.scale.y=legS;legR.position.y=legL.position.y=.75*legS;upper.position.y=-.75*(1-legS);
 bodyG.rotation.x=lean;bodyG.position.y=by;ang+=angD(face-ang)*Math.min(1,dt*8);man3.rotation.y=ang}

/* ---- camera shots ---- */
const SHOTS=[{d:26,h:11,az:.3,ly:2,fov:50},{d:12,h:5.2,az:0,ly:1.4,fov:50},{d:6.5,h:1.8,az:.35,ly:1.5,fov:46},{d:8,h:3,az:0,ly:1.6,fov:55,rel:Math.PI},{d:9,h:16,az:.2,ly:0,fov:48},{d:11,h:3,az:1.25,ly:1.5,fov:50},{d:5,h:.9,az:-.5,ly:2,fov:52},{d:4.6,h:2,az:0,ly:1.8,fov:44,rel:0},{d:15,h:7,az:-.9,ly:1.5,fov:52}];
const okShot=s=>man.inside?(s.rel===undefined&&Math.abs(s.az)<1.3&&s.d<14):true;
let shot=SHOTS[1],shotEnd=0,cp={d:12,h:5.2,az:0,ly:1.4,fov:50},ct={x:0,z:-2};
function cameraUpdate(dt){
 if(beat>=shotEnd||!okShot(shot)){let s;do{s=pick(SHOTS)}while(s===shot||!okShot(s));shot=s;shotEnd=beat+rnd(20,36)}
 const k=Math.min(1,dt*1.6),az=shot.rel!==undefined?ang+shot.rel+shot.az:shot.az+.18*Math.sin(T*.25);
 cp.d+=(shot.d-cp.d)*k;cp.h+=(shot.h-cp.h)*k;cp.ly+=(shot.ly-cp.ly)*k;cp.fov+=(shot.fov-cp.fov)*k;cp.az+=angD(az-cp.az)*k;
 ct.x+=(man.x-ct.x)*Math.min(1,dt*3);ct.z+=(man.z-ct.z)*Math.min(1,dt*3);
 cam.position.set(ct.x+Math.sin(cp.az)*cp.d,cp.h,ct.z+Math.cos(cp.az)*cp.d);cam.lookAt(ct.x,cp.ly,ct.z);
 if(Math.abs(cam.fov-cp.fov)>.01){cam.fov=cp.fov;cam.updateProjectionMatrix()}}

/* ---- update ---- */
const info=$('info'),tempoEl=$('tempo'),actEl=$('act'),v3=new THREE.Vector3(),c1=new THREE.Color(),c2=new THREE.Color();
let doorO=0,frontO=1;
function update(dt){
 T+=dt;bpm=78+27*Math.sin(T*.045);beatF+=dt*bpm/60;const nb2=Math.floor(beatF);
 man.inside=isIn(man.x,man.z);
 if(nb2>beat){beat=nb2;onBeat()}
 w.timer-=dt;if(w.timer<=0){w.cur=nextWeather();w.timer=rnd(35,65)}
 for(const k in L)L[k]+=(WT[w.cur][k]-L[k])*dt*.25;
 snowCover+=((L.snow>.3?1:(temp()>2?0:snowCover))-snowCover)*dt*.03;flash=Math.max(0,flash-dt*2.5);if(w.cur==='storm'&&Math.random()<dt*.15)flash=1;
 trees.forEach(t=>{if(t.blocks<=0){t.regrow-=dt;if(t.regrow<=0){t.blocks=4;t.hits=0;setTree(t)}}});
 if(fireOn){fireT-=dt*(1+Math.max(0,8-temp())/20+L.wind*.3);if(fireT<=0)fireOn=false;if(Math.random()<dt*5)spawn(true,3.4,H+3.2,-13,.6+L.wind*2,1.6,0,2.4,.5,0)}
 flames.forEach((m,i)=>{m.visible=fireOn;m.scale.y=.8+Math.sin(T*14+i*2)*.4;m.position.y=.9+m.scale.y*.25});
 fireL.intensity=fireOn?1.7+Math.sin(T*14)*.3:0;lampL.intensity=man.inside&&dayF()<.6?.7:0;
 if(man.act==='walk'){const dx=man.tx-man.x,dz=man.tz-man.z,dist=Math.hypot(dx,dz),sp=3.2*bpm/78*dt;
  if(dist<=sp){man.x=man.tx;man.z=man.tz;if(man.path.length){const p=man.path.shift();man.tx=p[0];man.tz=p[1]}else startAct(man.next)}else{man.x+=dx/dist*sp;man.z+=dz/dist*sp}}
 const near=Math.abs(man.x)<2.8&&man.z<-2.6&&man.z>-7.2;doorO+=((near?1:0)-doorO)*Math.min(1,dt*5);doorG.rotation.y=-1.6*doorO;
 frontO+=((man.inside?.14:1)-frontO)*Math.min(1,dt*4);cabM.opacity=frontO;roofCabM.opacity=man.inside?Math.max(0,roofCabM.opacity-dt*3):Math.min(1,roofCabM.opacity+dt*3);cabRoof.visible=roofCabM.opacity>.03;
 if(man.note){const n=man.endBeat-man.startBeat-2,p=clamp((beatF-man.startBeat)/n,0,1);man.note.span.textContent=man.note.full.slice(0,Math.floor(man.note.full.length*p));man.note.el.dataset.t=T}
 [...notesEl.children].forEach(e=>{const age=T-e.dataset.t;e.style.opacity=age>10?clamp(1-(age-10)/4,0,1):1;if(age>14)e.remove()});
 pool.forEach(p=>{if(p.life>0){p.life-=dt;p.vy+=p.g*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.scale.setScalar(p.sz*(p.smoke?2-p.life/p.max:1));if(p.life<=0)p.m.visible=false}});
 man3.position.set(man.x,0,man.z);pose(dt);cameraUpdate(dt);
 const d=dayF(),s=sunS(),a=2*Math.PI*(dayT()-.25),dusk=Math.max(0,1-Math.abs(s)*3.5)*.5,g=lerp(.12,.55,d);
 c1.setRGB(lerp(.03,.45,d)+dusk*.4,lerp(.05,.68,d)+dusk*.15,lerp(.14,.93,d));c2.setRGB(g,g+.03,g+.08);c1.lerp(c2,L.cloud*.6);
 scene.background=c1;scene.fog.color.copy(c1);scene.fog.near=lerp(40,2,L.fog);scene.fog.far=lerp(150,30,Math.min(1,L.fog+L.rain*.3));
 sun.intensity=lerp(.18,1.05,d)*(1-L.cloud*.45)+flash;sun.color.setRGB(lerp(.6,1,d),lerp(.69,.95,d),lerp(1,.85,d));hemi.intensity=lerp(.3,.75,d)+flash*1.2;
 sun.position.set(man.x-Math.cos(a)*40,18+Math.abs(Math.sin(a))*30,man.z+22);sun.target.position.set(man.x,0,man.z);
 sunMesh.position.set(man.x-Math.cos(a)*100,Math.sin(a)*80,-110);moonMesh.position.set(man.x+Math.cos(a)*100,-Math.sin(a)*80,-110);sunMesh.visible=s>-.1;moonMesh.visible=s<.1;
 stars.position.set(man.x,0,man.z);stars.material.opacity=clamp((1-d)*1.2-L.cloud*.5,0,1);
 cloudM.color.setRGB(1,1,1).lerp(c2.setRGB(.45,.47,.52),L.cloud).multiplyScalar(lerp(.3,1,d));cloudM.opacity=clamp(.35+.65*L.cloud,0,1);
 clouds.forEach(c=>{const u=c.userData;c.position.x=man.x+(((u.x0+T*u.s*(1+L.wind*3))%240)+240)%240-120;c.position.z=u.z});
 winM.color.setHex(d<.55||fireOn?0xffd36b:0xa7cfe6);snowP.material.opacity=snowCover*.92;
 roofM.forEach(([m,c])=>m.color.setHex(c).lerp(c2.setRGB(.95,.97,1),snowCover*.85));leafM.color.setHex(0x2e7d32).lerp(c2.setRGB(.85,.92,.88),snowCover*.55);
 [[rainP,L.rain*1800,22,1],[snowPts,L.snow*1500,3.2,.6]].forEach(([p,n,vy,wk])=>{p.visible=!man.inside;p.position.set(ct.x,0,ct.z);p.geometry.setDrawRange(0,Math.floor(n));const ar=p.geometry.attributes.position.array;
  for(let i=0;i<Math.floor(n);i++){ar[i*3+1]-=vy*dt;ar[i*3]-=L.wind*3*wk*dt;if(ar[i*3+1]<0)ar[i*3+1]=30;if(ar[i*3]<-30)ar[i*3]+=60}p.geometry.attributes.position.needsUpdate=true});
 const hrs=Math.floor(dayT()*24),mins=Math.floor((dayT()*24%1)*60),ym=yF()*12;
 info.innerHTML=`${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')} · ${Math.floor(ym%1*30)+1} ${MON[Math.floor(ym)]} · ${w.cur}<br>out ${temp()}°C · in ${inTemp()}°C · ${ALT} m<br>logs ${logs} · fire ${fireOn?'burning':'out'}`;
 tempoEl.textContent=`♩ = ${Math.round(bpm)} · 4/4`;actEl.textContent=NAMES[man.act]+(man.act==='gym'?' · '+man.ex+' ×'+Math.max(0,beat-man.startBeat):'');
 if(man.act==='talk'){v3.set(man.x,3.2,man.z).project(cam);bub.style.display='block';bub.style.left=clamp((v3.x*.5+.5)*innerWidth,90,innerWidth-90)+'px';bub.style.top=(-v3.y*.5+.5)*innerHeight+'px'}
}
function resize(){const iw=innerWidth,ih=innerHeight;ren.setSize(iw,ih);cam.aspect=iw/ih;const narrow=iw<760||iw<ih*.9;cam.setViewOffset(iw,ih,narrow?0:Math.min(170,iw*.14),narrow?ih*.1:0,iw,ih);cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
trees.forEach(setTree);choose();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);ren.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
